[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatezero"
version = "0.1.0"
description = "Code for \"What Does Model Growth Really Add? Functional Capacity Beyond Parameter Count\""
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "datasets>=2.14",
    "transformers>=4.40",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
